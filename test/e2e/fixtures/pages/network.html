<!doctype html>
<html><head><meta charset="utf-8"><title>Network</title></head>
<body>
<p id="s">loading</p>
<script>
  window.runRequests = async () => {
    const a = await fetch('/api/data?x=1').then((r) => r.json());
    await fetch('/api/echo', { method: 'POST', headers: { 'content-type': 'application/json', authorization: 'Bearer secret-token' }, body: JSON.stringify({ hello: 'world' }) });
    await fetch('/status/404').catch(() => {});
    document.getElementById('s').textContent = 'done ' + a.message;
    return a.message;
  };
</script>
</body></html>
