<!doctype html>
<html><head><meta charset="utf-8"><title>Long page</title>
<style>
  html, body { margin: 0; }
  .block { height: 1000px; border-bottom: 1px solid #999; }
  #inner { height: 200px; width: 300px; overflow: auto; border: 1px solid #000; }
  #inner div { height: 1000px; background: linear-gradient(#fff, #00f); }
  #target { background: #f80; width: 200px; height: 100px; }
</style></head>
<body>
<div id="inner"><div>scroll inside</div></div>
<div class="block">Block 1</div>
<div class="block">Block 2</div>
<div id="target">Target</div>
<div class="block">Block 3</div>
</body></html>
