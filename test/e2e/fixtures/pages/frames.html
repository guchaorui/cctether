<!doctype html>
<html lang="en">
<head>

<title>Console shell</title>
<style>

  header { height: 40px; background: #333; color: #fff; }
  #app { position: absolute; top: 40px; left: 60px; width: calc(100% - 70px); height: calc(100% - 50px); border: 3px solid #888; padding: 4px; }

</head>

<header>Cloud console <button type="button" id="top-create">Create</button></header>
<iframe id="app" src="/pages/frame-inner.html" title="Workload"></iframe>
<iframe id="ext" title="Help widget" style="position:absolute; left:0; top:40px; width:50px; height:50px; border:0"></iframe>
<footer>footer</footer>
</body>
</html>
