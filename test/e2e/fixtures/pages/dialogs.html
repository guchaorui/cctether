<!doctype html>
<html><head><meta charset="utf-8"><title>Dialogs</title></head>
<body>
<button id="alert" onclick="alert('Hello alert'); document.getElementById('r').textContent = 'alert done'">Alert</button>
<button id="confirm" onclick="document.getElementById('r').textContent = 'confirm:' + confirm('Are you sure?')">Confirm</button>
<button id="prompt" onclick="document.getElementById('r').textContent = 'prompt:' + prompt('Your name?', 'anon')">Prompt</button>
<p id="r">none</p>
</body></html>
